version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      python-patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: UTC
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      actions-patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 2
    rebase-strategy: auto
    groups:
      docker-patch-and-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor]

# Major updates remain individual PRs for maintainer review. Group membership
# does not grant merge permission; the separate auto-merge policy checks the PR.
